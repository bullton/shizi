<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>識字樂 - 中文拼字遊戲</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="logo">🎨 識字樂</div>
  <nav id="nav-buttons">
    <button class="nav-btn active" data-view="game">🎮 玩遊戲</button>
    <button class="nav-btn" data-view="admin">⚙️ 管理字庫</button>
    <span id="user-nav" class="hidden">
      <button class="nav-btn" data-view="dashboard">📊 我的進度</button>
      <button class="nav-btn" id="admin-btn" data-view="admin-panel" style="display:none">👑 管理</button>
      <span id="user-info"></span>
      <button class="nav-btn" id="logout-btn">🚪 登出</button>
    </span>
    <span id="login-nav">
      <button class="nav-btn" data-view="login">🔐 登入</button>
    </span>
  </nav>
</header>

<div class="container">
  <!-- 登入/註冊 -->
  <section id="view-login" class="view">
    <div class="card login-card">
      <h2 id="auth-title">登入</h2>
      <div class="form-field">
        <label>用戶名</label>
        <input type="text" id="auth-username" placeholder="例：john" maxlength="20">
      </div>
      <div class="form-field">
        <label>密碼</label>
        <input type="password" id="auth-password" placeholder="••••" maxlength="50">
      </div>
      <div class="form-actions">
        <button class="btn btn-primary" id="auth-submit">登入</button>
      </div>
      <p class="auth-switch">
        還沒有帳戶？<a href="#" id="auth-switch-link">立即註冊</a>
      </p>
      <p id="auth-error" class="error-msg hidden"></p>
    </div>
  </section>

  <!-- 遊戲 -->
  <section id="view-game" class="view active">
    <div class="game-info card">
      <div class="info-item">
        <span class="info-label">⭐ 分數</span>
        <span class="info-value" id="score">0</span>
      </div>
      <div class="info-item grow">
        <span class="info-label">📊 進度</span>
        <div class="progress-bar">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <span id="progress-text">0 / 0</span>
      </div>
      <div id="user-stats" class="hidden">
        <span class="info-label">📈 已學</span>
        <span id="chars-learned">0</span>
      </div>
    </div>

    <div class="card">
      <h2 class="instruction">把部件拖到正確位置組成字</h2>
      <div class="character-display" id="character-display"></div>
      <div class="hint-section">
        <button class="btn btn-hint" id="hint-btn">💡 口部委唄</button>
        <div class="hint-content hidden" id="hint-content"></div>
      </div>
    </div>

    <div class="card pieces-card">
      <h3>👇 部件</h3>
      <div class="pieces-tray" id="pieces-tray"></div>
    </div>

    <div class="game-actions">
      <button class="btn btn-secondary" id="reset-btn">🔄 重玩這一題</button>
      <button class="btn btn-secondary" id="skip-btn">⏭ 跳過</button>
      <button class="btn btn-primary hidden" id="next-btn">➡️ 下一個</button>
    </div>

    <div class="celebration hidden" id="celebration">
      <div class="celebration-content">
        <div class="celebration-emoji">🎉</div>
        <div class="celebration-text">答對了！</div>
      </div>
    </div>
  </section>

  <!-- 管理字庫 -->
  <section id="view-admin" class="view">
    <div class="admin-layout">
      <div class="card">
        <h2 id="form-title">新增字</h2>
        <div class="form-field">
          <label>字</label>
          <input type="text" id="form-char" maxlength="2" placeholder="例：媽">
        </div>
        <div class="form-field">
          <label>部件（用逗號分隔）</label>
          <input type="text" id="form-components" placeholder="例：女,馬">
          <small>提示：部件要等於字拆開的形狀</small>
        </div>
        <div class="form-field">
          <label>結構</label>
          <select id="form-layout">
            <option value="left-right">左右結構</option>
            <option value="top-bottom">上下結構</option>
            <option value="top-bottom-bottom">品字結構（三部分）</option>
            <option value="vertical-3">三疊結構（三部分上下）</option>
            <option value="top-bottom-bottom-bottom">四疊結構（四部分上下）</option>
            <option value="top-2-bottom">上中下結構（上1+中2左右+下1）</option>
            <option value="surround">包圍結構（外內）</option>
            <option value="half-surround-left">半包圍結構（辶包左）</option>
            <option value="complex-3-left">三方結構（辶左 + 上下右）</option>
            <option value="complex-4-left">四方結構（辶左 + 自穴方右）</option>
            <option value="surround-3">包圍結構（冖包上下）</option>
            <option value="left-right-right">左右右結構（林左右 + 手手上下）</option>
          </select>
        </div>
        <div class="form-field">
          <label>口部委唄（粵語）</label>
          <textarea id="form-hint" rows="3" placeholder="例：女人騎著一匹馬"></textarea>
        </div>
        <div class="form-actions">
          <button class="btn btn-primary" id="save-btn">💾 保存</button>
          <button class="btn btn-secondary" id="cancel-btn">✗ 取消</button>
        </div>
      </div>

      <div class="card">
        <div class="list-header">
          <h2>字庫 (<span id="char-count">0</span>)</h2>
          <button class="btn btn-secondary small" id="reset-data-btn">🔄 重置預設</button>
        </div>
        <div class="char-list" id="char-list"></div>
      </div>
    </div>
  </section>

  <!-- 用戶進度面板 -->
  <section id="view-dashboard" class="view">
    <div class="dashboard-header">
      <h2>📊 我的學習進度</h2>
    </div>
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-value" id="stat-chars">0</div>
        <div class="stat-label">已學字數</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="stat-attempts">0</div>
        <div class="stat-label">總練習次數</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="stat-avg-time">0s</div>
        <div class="stat-label">平均答題時間</div>
      </div>
    </div>
    <div class="card">
      <h3>📝 練習記錄</h3>
      <div class="progress-list" id="progress-list"></div>
    </div>
  </section>

  <!-- 管理員面板 -->
  <section id="view-admin-panel" class="view">
    <div class="dashboard-header">
      <h2>👑 管理員面板</h2>
    </div>
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-value" id="admin-users">0</div>
        <div class="stat-label">總用戶數</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="admin-chars">0</div>
        <div class="stat-label">被練習字數</div>
      </div>
    </div>

    <div class="admin-tabs">
      <button class="tab-btn active" data-tab="users">👥 用戶管理</button>
      <button class="tab-btn" data-tab="chars">📊 字學習統計</button>
    </div>

    <!-- 用戶管理 Tab -->
    <div id="tab-users" class="admin-tab active">
      <div class="card">
        <h3>👥 用戶列表</h3>
        <div class="user-list" id="admin-user-list"></div>
      </div>
      <div class="card" id="user-detail-panel" style="display:none">
        <div class="user-detail-header">
          <h3 id="user-detail-title">用戶詳情</h3>
          <button class="btn btn-secondary" id="close-user-detail">✕ 關閉</button>
        </div>
        <div id="user-detail-stats"></div>
        <div id="user-detail-records"></div>
      </div>
    </div>

    <!-- 字統計 Tab -->
    <div id="tab-chars" class="admin-tab">
      <div class="card">
        <h3>📊 字學習統計</h3>
        <div class="char-stats-list" id="char-stats-list"></div>
      </div>
    </div>
  </section>
</div>

<div id="toast" class="toast hidden"></div>
<script src="chaizi-data.js"></script>
<script src="app.js"></script>
</body>
</html>
