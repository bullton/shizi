<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>識字樂 - 中文拼字遊戲</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="logo">🎨 識字樂</div>
  <nav>
    <button class="nav-btn active" data-view="game">🎮 玩遊戲</button>
    <button class="nav-btn" data-view="admin">⚙️ 管理字庫</button>
  </nav>
</header>

<div class="container">
  <section id="view-game" class="view active">
    <div class="game-info card">
      <div class="info-item">
        <span class="info-label">⭐ 分數</span>
        <span class="info-value" id="score">0</span>
      </div>
      <div class="info-item grow">
        <span class="info-label">📊 進度</span>
        <div class="progress-bar">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <span id="progress-text">0 / 0</span>
      </div>
    </div>

    <div class="card">
      <h2 class="instruction">把部件拖到正確位置組成字</h2>
      <div class="character-display" id="character-display"></div>
      <div class="hint-section">
        <button class="btn btn-hint" id="hint-btn">💡 口訣提示</button>
        <div class="hint-content hidden" id="hint-content"></div>
      </div>
    </div>

    <div class="card pieces-card">
      <h3>👇 部件</h3>
      <div class="pieces-tray" id="pieces-tray"></div>
    </div>

    <div class="game-actions">
      <button class="btn btn-secondary" id="reset-btn">🔄 重玩這一題</button>
      <button class="btn btn-secondary" id="skip-btn">⏭ 跳過</button>
      <button class="btn btn-primary hidden" id="next-btn">➡️ 下一個</button>
    </div>

    <div class="celebration hidden" id="celebration">
      <div class="celebration-content">
        <div class="celebration-emoji">🎉</div>
        <div class="celebration-text">答對了！</div>
      </div>
    </div>
  </section>

  <section id="view-admin" class="view">
    <div class="admin-layout">
      <div class="card">
        <h2 id="form-title">新增字</h2>
        <div class="form-field">
          <label>字</label>
          <input type="text" id="form-char" maxlength="2" placeholder="例：媽">
        </div>
        <div class="form-field">
          <label>部件（用逗號分隔）</label>
          <input type="text" id="form-components" placeholder="例：女,馬">
          <small>提示：部件要等於字拆開的形狀</small>
        </div>
        <div class="form-field">
          <label>結構</label>
          <select id="form-layout">
            <option value="left-right">左右結構</option>
            <option value="top-bottom">上下結構</option>
            <option value="top-bottom-bottom">品字結構（三部分）</option>
            <option value="surround">包圍結構（外內）</option>
            <option value="half-surround-left">半包圍結構（辶包左）</option>
            <option value="complex-3-left">三方結構（辶左 + 上下右）</option>
            <option value="complex-4-left">四方結構（辶左 + 自穴方右）</option>
            <option value="surround-3">包圍結構（冖包上下）</option>
            <option value="left-right-right">左右右結構（林左右 + 手手上下）</option>
          </select>
        </div>
        <div class="form-field">
          <label>口訣（粵語）</label>
          <textarea id="form-hint" rows="3" placeholder="例：女人騎著一匹馬"></textarea>
        </div>
        <div class="form-actions">
          <button class="btn btn-primary" id="save-btn">💾 保存</button>
          <button class="btn btn-secondary" id="cancel-btn">✗ 取消</button>
        </div>
      </div>

      <div class="card">
        <div class="list-header">
          <h2>字庫 (<span id="char-count">0</span>)</h2>
          <button class="btn btn-secondary small" id="reset-data-btn">🔄 重置預設</button>
        </div>
        <div class="char-list" id="char-list"></div>
      </div>
    </div>
  </section>
</div>

<div id="toast" class="toast hidden"></div>
<script src="app.js"></script>
</body>
</html>
